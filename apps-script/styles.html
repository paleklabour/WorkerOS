<style>
:root {
    --navy-dark: #0f172a;       /* Slate black - Google AI Studio primary */
    --navy-medium: #1e293b;     /* Card headings and text */
    --navy-light: #64748b;      /* Muted details */
    --gold-primary: #1e3b8b;    /* Rich blue primary accent */
    --gold-hover: #172e6b;      /* Darker primary on hover */
    --gold-light: rgba(30, 58, 138, 0.04); /* Light blue accent background */
    --gold-border: rgba(30, 58, 138, 0.1);
    --gray-bg: #f8fafc;         /* Pure minimalist background */
    --gray-card: #ffffff;       /* Pure white card container */
    --text-dark: #334155;       /* Charcoal gray text - gentle for eyes */
    --text-muted: #64748b;      /* Muted gray text */
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius-sm: 6px;           /* Modern rounded corners */
    --radius-md: 10px;          /* Card rounded corners */
    --radius-lg: 14px;          /* Modal rounded corners */
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.04), 0 4px 6px -2px rgba(15, 23, 42, 0.02);
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ==================== BASE STYLES & RESET ==================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--gray-bg);
    color: var(--text-dark);
    line-height: 1.5;
    overflow-x: hidden;
    font-size: 13.5px; /* Clean developer-focused density */
}

/* Custom Scrollbars styled like Google AI Studio */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: #e2e8f0;
    border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
    background: #cbd5e1;
}

h1, h2, h3, h4, h5, h6 {
    font-weight: 500;
    color: var(--navy-dark);
    letter-spacing: -0.01em;
}

/* Utility classes */
.hidden {
    display: none !important;
}

.text-gold { color: var(--gold-primary) !important; }
.text-danger { color: var(--danger) !important; }
.text-success { color: var(--success) !important; }
.text-warning { color: var(--warning) !important; }

/* Buttons with micro-interactions */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
}
.btn:active {
    transform: scale(0.97);
}

.btn-block {
    display: flex;
    width: 100%;
}

.btn-gold {
    background-color: var(--gold-primary);
    color: #ffffff;
}

.btn-gold:hover {
    background-color: var(--gold-hover);
}

.btn-outline {
    background-color: transparent;
    border-color: #e2e8f0;
    color: var(--text-dark);
}

.btn-outline:hover {
    background-color: #f8fafc;
    border-color: #cbd5e1;
    color: var(--navy-dark);
}

.btn-danger {
    background-color: #fef2f2;
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.1);
}

.btn-danger:hover {
    background-color: var(--danger);
    color: white;
    border-color: var(--danger);
}

.btn-sm {
    padding: 6px 12px;
    font-size: 12px;
}

/* Status Badges - Clean Pill Design */
.badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    border: 1px solid transparent;
}

.badge-gold {
    background-color: #f8fafc;
    color: var(--gold-primary);
    border-color: var(--gold-border);
}

.badge-danger {
    background-color: #fef2f2;
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.08);
}

.badge-success {
    background-color: #ecfdf5;
    color: var(--success);
    border-color: rgba(16, 185, 129, 0.08);
}

.badge-warning {
    background-color: #fffbeb;
    color: var(--warning);
    border-color: rgba(245, 158, 11, 0.08);
}

/* Form Controls */
.form-group {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy-medium);
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13.5px;
    background-color: #ffffff;
    transition: var(--transition);
    color: var(--text-dark);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.08);
}

.form-row {
    display: flex;
    gap: 16px;
}

.col-6 { width: 50%; }
.col-4 { width: 33.33%; }
.col-12 { width: 100%; }

.required {
    color: var(--danger);
}

/* ==================== LOGIN VIEW ==================== */
#login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--gray-bg);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 440px;
}

.login-card {
    background-color: var(--gray-card);
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-lg);
    padding: 40px;
    box-shadow: var(--shadow-lg);
}

.login-header {
    text-align: center;
    margin-bottom: 28px;
}

.logo-gold {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, var(--gold-primary) 0%, #3b82f6 100%);
    border-radius: var(--radius-md);
    margin: 0 auto 16px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 4px 6px rgba(30, 58, 138, 0.15);
}

.logo-gold svg {
    width: 26px;
    height: 26px;
}

.login-header h2 {
    color: var(--navy-dark);
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
}

.login-header .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
}

#login-form .form-group label {
    color: var(--navy-dark);
    font-weight: 600;
}

#login-form input {
    background-color: #ffffff;
    border-color: #cbd5e1;
    color: var(--text-dark);
}

#login-form input:focus {
    border-color: var(--gold-primary);
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.08);
}

.error-msg {
    color: var(--danger);
    background-color: #fef2f2;
    border: 1px solid rgba(239, 68, 68, 0.15);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    font-weight: 500;
}

.demo-accounts {
    margin-top: 24px;
    border-top: 1px solid #e2e8f0;
    padding-top: 20px;
}

.demo-accounts h4 {
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    text-align: center;
    font-weight: 500;
}

.demo-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.demo-badge {
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    color: var(--text-dark);
    text-align: left;
    font-family: inherit;
}

.demo-badge:hover {
    background-color: #f1f5f9;
    border-color: var(--gold-primary);
}

.demo-badge strong {
    font-size: 12.5px;
    font-weight: 500;
}

.demo-badge span {
    font-size: 11px;
    color: var(--text-muted);
}

.demo-badge.admin strong { color: var(--gold-primary); }
.demo-badge.manager strong { color: #0284c7; }
.demo-badge.staff strong { color: #059669; }


/* ==================== LAYOUT (SIDEBAR & MAIN) ==================== */
#main-layout {
    display: flex;
    min-height: 100vh;
}

/* Sidebar styling */
/* Sidebar styling */
.sidebar {
    width: 256px;
    background-color: #ffffff;
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    border-right: 1px solid #e2e8f0;
    flex-shrink: 0;
}

.sidebar-brand {
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #f1f5f9;
}

.brand-logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--gold-primary) 0%, #3b82f6 100%);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 2px 4px rgba(30, 58, 138, 0.1);
}

.brand-text h3 {
    color: var(--navy-dark);
    font-size: 15px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
}

.brand-text span {
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
}

.sidebar-user {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: #f8fafc;
    border-bottom: 1px solid #f1f5f9;
}

.user-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background-color: #ffffff;
    border: 1.5px solid var(--gold-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-primary);
    font-weight: 600;
    font-size: 15px;
    box-shadow: var(--shadow-sm);
}

.user-info h4 {
    color: var(--navy-dark);
    font-size: 13.5px;
    margin-bottom: 2px;
    font-weight: 600;
}

.sidebar-menu {
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-grow: 1;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    transition: var(--transition);
    position: relative;
}

.menu-item svg {
    color: #64748b;
    transition: var(--transition);
    width: 18px;
    height: 18px;
}

.menu-item:hover {
    background-color: #f1f5f9;
    color: var(--navy-dark);
}

.menu-item.active {
    background-color: rgba(30, 58, 138, 0.05);
    color: var(--gold-primary);
    font-weight: 600;
}

.menu-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 20%;
    height: 60%;
    width: 3.5px;
    background-color: var(--gold-primary);
    border-radius: 2px;
}

.menu-item:hover svg {
    color: var(--navy-dark);
}

.menu-item.active svg {
    color: var(--gold-primary);
}

.menu-badge {
    margin-left: auto;
    background-color: var(--danger);
    color: white;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 9999px;
    font-weight: 600;
}

.sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid #f1f5f9;
}

.btn-logout {
    border-color: #fee2e2;
    color: #ef4444;
    background-color: #ffffff;
}

.btn-logout:hover {
    background-color: #fef2f2;
    color: #ef4444;
    border-color: #fca5a5;
}

/* Main Panel styling */
.main-panel {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-y: auto;
}

/* Top Header Bar */
.top-bar {
    height: 70px;
    background-color: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
}

.page-title h2 {
    font-size: 20px;
    font-weight: 600;
}

.top-bar-actions {
    display: flex;
    align-items: center;
    gap: 20px;
}

.notification-bell {
    position: relative;
    cursor: pointer;
    color: var(--navy-medium);
    padding: 6px;
    border-radius: 50%;
    transition: var(--transition);
}

.notification-bell:hover {
    background-color: rgba(23, 42, 69, 0.05);
}

.bell-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 16px;
    height: 16px;
    background-color: var(--danger);
    color: white;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
}

.current-date {
    font-size: 13.5px;
    color: var(--text-muted);
}

/* Content Body */
.content-body {
    padding: 30px;
    flex-grow: 1;
    max-width: 100%;
    width: 100%;
    margin: 0 auto;
}

.content-section {
    animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}


/* ==================== DASHBOARD VIEW ==================== */
/* Stats Grid */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stats-card {
    background-color: var(--gray-card);
    border-radius: var(--radius-md);
    padding: 24px;
    border: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.stats-card::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background-color: transparent;
    transition: var(--transition);
}

.stats-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: #cbd5e1;
}

.stats-card:hover::after {
    background-color: var(--gold-primary);
}

.stats-card.alert-card {
    background-color: var(--gray-card);
    border-color: rgba(239, 68, 68, 0.2);
}

.stats-card.alert-card:hover {
    border-color: var(--danger);
}

.stats-card.alert-card:hover::after {
    background-color: var(--danger);
}

.stats-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: rgba(30, 58, 138, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-primary);
    transition: var(--transition);
}

.stats-card:hover .stats-icon {
    background-color: var(--gold-primary);
    color: #ffffff;
}

.stats-icon.text-danger {
    background-color: #fef2f2;
    color: var(--danger);
}

.stats-card.alert-card:hover .stats-icon.text-danger {
    background-color: var(--danger);
    color: #ffffff;
}

.stats-icon svg {
    width: 22px;
    height: 22px;
}

.stats-info h3 {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.1;
    margin-bottom: 4px;
    color: var(--navy-dark);
    letter-spacing: -0.02em;
}

.stats-info p {
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 500;
}

/* Dashboard Panels */
.dashboard-grid {
    display: grid;
    grid-template-columns: 2fr 1.2fr;
    gap: 24px;
}

.dashboard-panel {
    background-color: var(--gray-card);
    border-radius: var(--radius-md);
    border: 1px solid #e2e8f0;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.panel-header {
    padding: 18px 24px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #ffffff;
}

.panel-header h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--navy-dark);
}

.panel-content {
    padding: 24px;
    flex-grow: 1;
}

/* Alert Notification List */
.panel-alerts .panel-content {
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.alert-item {
    padding: 16px;
    border-radius: var(--radius-sm);
    border-left: 4px solid var(--danger);
    background-color: #fff8f8;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    transition: var(--transition);
}

.alert-item:hover {
    box-shadow: 0 4px 8px rgba(0,0,0,0.03);
}

.alert-item.warning {
    border-left-color: var(--warning);
    background-color: #fffbeb;
}

.alert-icon {
    font-size: 20px;
    line-height: 1;
}

.alert-body {
    flex-grow: 1;
}

.alert-body h4 {
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 4px;
}

.alert-body p {
    font-size: 13px;
    color: var(--text-muted);
}

.alert-meta {
    display: flex;
    gap: 12px;
    margin-top: 6px;
}

.alert-meta span {
    font-size: 11px;
}

.alert-action {
    flex-shrink: 0;
}

.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-muted);
    text-align: center;
    font-size: 14px;
}

/* Charts Components (CSS Bars) */
.nationality-chart-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.chart-bar-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.bar-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
}

.bar-track {
    height: 10px;
    background-color: #e2e8f0;
    border-radius: 9999px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    border-radius: 9999px;
    transition: width 1s ease-out;
}

.bar-fill.myanmar { background-color: var(--gold-primary); }
.bar-fill.cambodia { background-color: var(--navy-light); }
.bar-fill.laos { background-color: #38bdf8; }
.bar-fill.vietnam { background-color: #a855f7; }

/* Locations List */
.customer-locations-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
}

.location-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background-color: var(--gray-bg);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
}

.location-name {
    font-weight: 500;
}


/* ==================== DATA TABLES ==================== */
.table-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 20px;
    flex-wrap: wrap;
}

.search-filters-group {
    display: flex;
    gap: 16px;
    flex-grow: 1;
    flex-wrap: wrap;
}

.search-box {
    position: relative;
    width: 100%;
    max-width: 360px;
}

.search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

.search-box input {
    width: 100%;
    padding: 10px 14px 10px 42px;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    background-color: #ffffff;
    transition: var(--transition);
}

.search-box input:focus {
    outline: none;
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.filter-box {
    display: flex;
    gap: 10px;
}

.filter-box select {
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: var(--radius-sm);
    background-color: #ffffff;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
}

.table-container {
    background-color: var(--gray-card);
    border-radius: var(--radius-md);
    border: 1px solid #e2e8f0;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13px;
}

.data-table th {
    background-color: #f8fafc;
    color: var(--navy-dark);
    font-weight: 600;
    padding: 12px 20px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 12.5px;
    letter-spacing: -0.01em;
}

.data-table td {
    padding: 14px 20px;
