<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>เอกสารปิดงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* โฟลเดอร์เอกสารปิดงานของใบงาน 1 ใบ (owner 2026-10-26) — หน้าตาเดียวกับ share.html */
    :root {
        --navy-dark: #0f172a;
        --gold-primary: #1e3b8b;
        --gold-border: rgba(30, 58, 138, 0.1);
        --text-muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Sukhumvit Set", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
        background: #f8fafc;
        color: var(--navy-dark);
        padding: 20px 16px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    header {
        background: linear-gradient(135deg, var(--gold-primary) 0%, #3b82f6 100%);
        color: white;
        padding: 20px 24px;
        border-radius: 14px;
        margin-bottom: 16px;
    }
    header h1 { margin: 0 0 6px 0; font-size: 19px; }
    header p { margin: 2px 0 0; font-size: 13.5px; opacity: 0.9; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar span { font-size: 13.5px; color: var(--text-muted); }
    .btn {
        border: none; border-radius: 999px; padding: 9px 18px; font: inherit; font-size: 14px; font-weight: 600;
        background: var(--gold-primary); color: white; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card { border: 1px solid var(--gold-border); border-radius: 12px; overflow: hidden; background: white; display: flex; flex-direction: column; }
    .card iframe, .card img { width: 100%; height: 220px; border: none; display: block; background: #f1f5f9; object-fit: cover; }
    .card .meta { padding: 10px 12px; border-top: 1px solid #f1f5f9; }
    .card .fname { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .card a { font-size: 13px; color: var(--gold-primary); text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .note { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
    #status { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1 id="title">กำลังโหลดเอกสาร...</h1>
        <p id="sub"></p>
        <p>ลิงก์นี้ใช้ดู/ดาวน์โหลดเอกสารเท่านั้น — ไม่ต้องเข้าสู่ระบบ</p>
    </header>
    <div id="status"></div>
    <div class="toolbar" id="toolbar" style="display:none">
        <span id="count"></span>
        <button class="btn" id="zip-btn" type="button" onclick="downloadAll()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
            ดาวน์โหลดทั้งหมด (ZIP)
        </button>
    </div>
    <p class="note" id="note" style="display:none"></p>
    <div id="grid"></div>
</div>
<script>
    const SUPABASE_URL = "https://cagpzvrqtjkuabhqaqon.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QXr8rEnSqOhAZzc_pO_Egw_h-ZYb0nn";
    let shared = null;

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isImage = (f) => /\.(jpe?g|png|gif|webp|bmp)(\?|$)/i.test(f.name || '') || /\.(jpe?g|png|gif|webp|bmp)(\?|$)/i.test(f.url || '');

    function renderCard(f, k) {
        const name = f.name || `ไฟล์ ${k + 1}`;
        const preview = isImage(f) ? `<img src="${esc(f.url)}" alt="">` : `<iframe src="${esc(f.url)}"></iframe>`;
        return `<div class="card">${preview}
            <div class="meta">
                <div class="fname" title="${esc(name)}">${esc(name)}</div>
                <a href="${esc(f.url)}" target="_blank" rel="noopener">ดาวน์โหลด / เปิดเต็มจอ</a>
            </div>
        </div>`;
    }

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    // รวมทุกไฟล์เป็น ZIP ในเบราว์เซอร์ (ชื่อซ้ำเติม _2, _3)
    async function downloadAll() {
        const btn = document.getElementById('zip-btn');
        btn.disabled = true;
        try {
            if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
            const zip = new JSZip();
            const used = {};
            for (const [k, f] of shared.files.entries()) {
                const blob = await (await fetch(f.url)).blob();
                let name = (f.name || `ไฟล์ ${k + 1}`).replace(/[\\/:*?"<>|]/g, '_');
                if (used[name]) { const n = ++used[name]; name = name.replace(/(\.[^.]*)?$/, m => `_${n}${m}`); } else used[name] = 1;
                zip.file(name, blob);
            }
            const out = await zip.generateAsync({ type: 'blob' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(out);
            a.download = `เอกสารปิดงาน ${shared.worker || ''} ${shared.jobType || ''}`.trim() + '.zip';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        } catch (e) {
            alert('ดาวน์โหลดรวมไม่สำเร็จ — กดดาวน์โหลดทีละไฟล์แทน');
        } finally {
            btn.disabled = false;
        }
    }

    async function load() {
        const params = new URLSearchParams(location.search);
        const id = params.get('j');
        const token = params.get('t');
        const statusEl = document.getElementById('status');
        const titleEl = document.getElementById('title');
        if (!id || !token) {
            titleEl.textContent = 'ลิงก์ไม่ถูกต้อง';
            statusEl.textContent = 'ลิงก์นี้ไม่มีข้อมูลครบถ้วน กรุณาขอลิงก์ใหม่จากเจ้าหน้าที่';
            return;
        }
        try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/share-job-docs?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,
                { headers: { apikey: SUPABASE_ANON_KEY } });
            const result = await res.json();
            if (!res.ok || result.status !== 'success') {
                titleEl.textContent = 'ไม่พบเอกสาร';
                statusEl.textContent = result.message || 'ลิงก์นี้ถูกยกเลิกแล้ว หรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่จากเจ้าหน้าที่';
                return;
            }
            shared = result;
            titleEl.textContent = `เอกสารปิดงาน ${result.jobType || ''}`.trim();
            document.getElementById('sub').textContent = [result.worker, result.employer].filter(Boolean).join(' · ');
            if (!result.files.length) {
                statusEl.textContent = 'ใบงานนี้ยังไม่มีเอกสารปิดงาน';
                return;
            }
            document.getElementById('toolbar').style.display = '';
            document.getElementById('count').textContent = `${result.files.length} ไฟล์`;
            const note = result.files.map(f => f.note).find(Boolean);
            if (note) { const el = document.getElementById('note'); el.textContent = `หมายเหตุ: ${note}`; el.style.display = ''; }
            document.getElementById('grid').innerHTML = result.files.map(renderCard).join('');
        } catch (e) {
            titleEl.textContent = 'เกิดข้อผิดพลาด';
            statusEl.textContent = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง';
        }
    }

    load();
</script>
</body>
</html>
