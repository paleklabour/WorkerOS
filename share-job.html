<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>เอกสารปิดงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* โฟลเดอร์เอกสารปิดงานของใบงาน 1 ใบ (owner 2026-10-26)
       หน้าตา "แบบ 2" ที่เจ้าของเลือก (2026-10-27): แผงข้อมูลงาน + ปุ่ม ZIP ด้านซ้าย, ทุกไฟล์เห็นพร้อมกันเป็นตารางด้านขวา
       จอเดียวไม่ต้องเลื่อนหน้า — จำนวนคอลัมน์/แถวคำนวณจากจำนวนไฟล์ (layoutGrid) ให้พอดีพื้นที่
       สีและมุมโค้งตามธีมสว่างของ WorkerOS (พื้น #e7eaf0, การ์ด #f8f9fb, สีหลัก #2d6cf6, ปุ่มแคปซูล) */
    :root {
        --bg: #e7eaf0;
        --card: #f8f9fb;
        --line: #eceef3;
        --text: #1c2230;
        --muted: #5b6475;
        --accent: #2d6cf6;
        --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 10px 30px rgba(20, 30, 60, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Sukhumvit Set", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
    }
    body::before {
        content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: radial-gradient(60% 50% at 15% 0%, rgba(45, 108, 246, .10), transparent 70%),
                    radial-gradient(50% 40% at 100% 100%, rgba(45, 108, 246, .07), transparent 70%);
    }
    .hidden { display: none !important; }
    .app { height: 100vh; height: 100dvh; display: flex; gap: 14px; padding: 16px; max-width: 1800px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }

    /* แผงซ้าย */
    .side { width: 330px; flex-shrink: 0; padding: 22px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
    .side img.logo { width: 52px; height: 52px; object-fit: contain; }
    .kicker { font-size: 13px; color: var(--muted); }
    .side h1 { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700; }
    .info { background: #fff; border-radius: 16px; overflow: hidden; font-size: 14px; }
    .info div { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
    .info div:last-child { border-bottom: none; }
    .info span:first-child { color: var(--muted); flex-shrink: 0; }
    .info span:last-child { text-align: right; font-weight: 600; }
    .info span.is-expired { color: #c0392b; }
    .exp-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
    .exp-dot.is-ok { background: #2f8a5c; } .exp-dot.is-warn { background: #e08a12; } .exp-dot.is-bad { background: #c62828; }
    .info div.is-stack { flex-direction: column; gap: 3px; }
    .info div.is-stack span:last-child { text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .info-group { display: flex; flex-direction: column; gap: 6px; }
    .info-label { font-size: 12.5px; color: var(--muted); padding-left: 14px; }
    .worker-card { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px; }
    .worker-card .avatar { width: 64px; height: 64px; border-radius: 999px; flex-shrink: 0; object-fit: cover; background: #d8dde8; color: #3a4252;
        display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
    .worker-card .wname { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .worker-card .wsub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
    .note { background: #fff6e6; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: #7a4a00; line-height: 1.5; }
    .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .side-foot small { font-size: 12.5px; color: var(--muted); text-align: center; }

    .btn {
        border: none; border-radius: 999px; height: 46px; padding: 0 20px; font: inherit; font-size: 15px; font-weight: 600;
        background: var(--accent); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        text-decoration: none;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn svg { width: 17px; height: 17px; }
    .icon-btn {
        width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; border: none; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; background: #eceef3; color: var(--text); text-decoration: none;
    }
    .icon-btn.primary { background: var(--accent); color: #fff; }
    .icon-btn:hover { filter: brightness(.97); }
    .icon-btn:disabled { opacity: .6; cursor: wait; }
    .icon-btn svg { width: 15px; height: 15px; }

    /* ตารางไฟล์ด้านขวา */
    .grid { flex: 1; min-width: 0; display: grid; gap: 14px; }
    .tile { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .tile-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-bottom: 1px solid #e3e6ee; }
    .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #fde7e4; color: #a8321f; flex-shrink: 0; }
    .tag.img { background: #e6eeff; color: #1d4fc4; }
    .tile-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-body { flex: 1; min-height: 0; background: #eef0f4; border-radius: 0 0 22px 22px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .tile-body iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .tile-body img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }

    #status { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; color: var(--muted); font-size: 15px; }

    /* มือถือ/จอแคบ: แผงข้อมูลอยู่บน ไฟล์เรียงทีละใบ เลื่อนหน้าได้ */
    @media (max-width: 860px) {
        body { overflow: auto; }
        .app { height: auto; min-height: 100dvh; flex-direction: column; padding: 10px; gap: 10px; }
        .side { width: auto; overflow: visible; padding: 18px; gap: 14px; }
        .side-foot { margin-top: 0; }
        .grid { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; grid-auto-rows: 70vh; }
    }
</style>
</head>
<body>
<div class="app">
    <aside class="card side">
        <img class="logo" src="assets/logo-transparent.png" alt="">
        <div>
            <div class="kicker">เอกสารปิดงาน</div>
            <h1 id="title">กำลังโหลดเอกสาร...</h1>
        </div>
        <div class="worker-card hidden" id="worker-card"></div>
        <div class="info-group hidden" id="worker-info-group">
            <div class="info-label">ข้อมูลคนงาน</div>
            <div class="info" id="worker-info"></div>
        </div>
        <div class="info-group hidden" id="info-group">
            <div class="info-label">ใบงาน</div>
            <div class="info" id="info"></div>
        </div>
        <div class="note hidden" id="note"></div>
        <div class="side-foot">
            <button class="btn hidden" id="zip-btn" type="button" onclick="downloadAll()" title="ดาวน์โหลดเอกสารทุกไฟล์รวมเป็น ZIP">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
                ดาวน์โหลดทั้งหมด (ZIP)
            </button>
            <small id="foot">ดู/ดาวน์โหลดได้ ไม่ต้องเข้าสู่ระบบ</small>
        </div>
    </aside>
    <div class="card" id="status"></div>
    <main class="grid hidden" id="grid"></main>
</div>
<script>
    const SUPABASE_URL = "https://cagpzvrqtjkuabhqaqon.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QXr8rEnSqOhAZzc_pO_Egw_h-ZYb0nn";
    let shared = null;

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const IMG_RE = /\.(jpe?g|png|gif|webp|bmp)(\?|$)/i;
    const isImage = (f) => IMG_RE.test(f.name || '') || IMG_RE.test(f.url || '');
    const fileName = (f, k) => f.name || `ไฟล์ ${k + 1}`;
    const extOf = (f) => ((String(f.name || f.url || '').split('?')[0].match(/\.([a-z0-9]+)$/i) || [])[1] || 'ไฟล์').toUpperCase().slice(0, 4);
    const thaiDate = (iso) => {
        const d = new Date(iso);
        if (isNaN(d)) return '';
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear() + 543}`;
    };
    const ICON_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
    const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>';

    function renderTile(f, k) {
        const name = fileName(f, k);
        const img = isImage(f);
        return `<section class="card tile">
            <div class="tile-head">
                <span class="tag${img ? ' img' : ''}">${img ? 'รูป' : esc(extOf(f))}</span>
                <div class="tile-name" title="${esc(name)}">${esc(name)}</div>
                <a class="icon-btn" href="${esc(f.url)}" target="_blank" rel="noopener" title="เปิดไฟล์นี้เต็มจอ" aria-label="เปิดไฟล์นี้เต็มจอ">${ICON_OPEN}</a>
                <button class="icon-btn primary" type="button" onclick="downloadOne(${k}, this)" title="ดาวน์โหลดไฟล์นี้" aria-label="ดาวน์โหลดไฟล์นี้">${ICON_DL}</button>
            </div>
            <div class="tile-body">${img
                ? `<img src="${esc(f.url)}" alt="${esc(name)}" onclick="window.open(this.src, '_blank', 'noopener')">`
                : `<iframe src="${esc(f.url)}#view=FitH" title="${esc(name)}"></iframe>`}</div>
        </section>`;
    }

    // จัดคอลัมน์/แถวให้ทุกไฟล์พอดีพื้นที่ด้านขวา (เลือกแบบที่ช่องใกล้สัดส่วนกระดาษ A4 แนวตั้งที่สุด)
    function layoutGrid() {
        const grid = document.getElementById('grid');
        if (!shared || !shared.files.length || window.matchMedia('(max-width: 860px)').matches) {
            grid.style.gridTemplateColumns = grid.style.gridTemplateRows = '';
            return;
        }
        const n = shared.files.length;
        const W = grid.clientWidth, H = grid.clientHeight, gap = 14, target = 1 / 1.25;
        let best = { cols: 1, score: Infinity };
        for (let cols = 1; cols <= n; cols++) {
            const rows = Math.ceil(n / cols);
            const w = (W - gap * (cols - 1)) / cols, h = (H - gap * (rows - 1)) / rows;
            if (w < 160 || h < 160) continue;
            const score = Math.abs(Math.log((w / h) / target)) + (cols * rows - n) * 0.15;
            if (score < best.score) best = { cols, score };
        }
        const cols = best.score === Infinity ? Math.max(1, Math.floor((W + gap) / (220 + gap))) : best.cols;
        const rows = Math.ceil(n / cols);
        grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        // ไฟล์เยอะมากจนช่องเล็กเกินไป → ให้ตารางเลื่อนในตัวเอง (หน้าหลักยังไม่เลื่อน)
        const tooMany = best.score === Infinity;
        grid.style.gridTemplateRows = tooMany ? '' : `repeat(${rows}, minmax(0, 1fr))`;
        grid.style.gridAutoRows = tooMany ? '300px' : '';
        grid.style.overflowY = tooMany ? 'auto' : '';
    }
    window.addEventListener('resize', layoutGrid);

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    function saveBlob(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    // ไฟล์อยู่คนละโดเมน — ดึงเป็น blob ก่อนจึงจะตั้งชื่อไฟล์ตอนดาวน์โหลดได้ (ไม่ได้ก็เปิดในแท็บใหม่แทน)
    async function downloadOne(k, btn) {
        const f = shared && shared.files[k];
        if (!f) return;
        btn.disabled = true;
        try {
            saveBlob(await (await fetch(f.url)).blob(), fileName(f, k).replace(/[\\/:*?"<>|]/g, '_'));
        } catch (e) {
            window.open(f.url, '_blank', 'noopener');
        } finally {
            btn.disabled = false;
        }
    }

    // รวมทุกไฟล์เป็น ZIP ในเบราว์เซอร์ (ชื่อซ้ำเติม _2, _3)
    async function downloadAll() {
        const btn = document.getElementById('zip-btn');
        btn.disabled = true;
        try {
            if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
            const zip = new JSZip();
            const used = {};
            for (const [k, f] of shared.files.entries()) {
                const blob = await (await fetch(f.url)).blob();
                let name = fileName(f, k).replace(/[\\/:*?"<>|]/g, '_');
                if (used[name]) { const n = ++used[name]; name = name.replace(/(\.[^.]*)?$/, m => `_${n}${m}`); } else used[name] = 1;
                zip.file(name, blob);
            }
            saveBlob(await zip.generateAsync({ type: 'blob' }), `เอกสารปิดงาน ${shared.worker || ''} ${shared.jobType || ''}`.trim() + '.zip');
        } catch (e) {
            alert('ดาวน์โหลดรวมไม่สำเร็จ — กดดาวน์โหลดทีละไฟล์แทน');
        } finally {
            btn.disabled = false;
        }
    }

    // แถว [ป้าย, ค่า, หมดอายุแล้ว?] → รายการซ้าย/ขวาแบบ iOS
    // stack = ป้ายอยู่บรรทัดบน ค่าเต็มบรรทัดล่าง (เลขเอกสาร + หมดอายุ ยาวเกินแผง 330px — owner 2026-10-29: "หมดอายุ" ต้องอยู่บรรทัดเดียวกับเลข)
    // dot = จุดสีสถานะวันหมดอายุ (ok / warn / bad) หน้าค่า — owner 2026-10-29 แบบเดียวกับแผงคนงานในระบบ
    const infoRowsHtml = (rows) => rows.map(([k, v, bad, stack, dot]) => `<div${stack ? ' class="is-stack"' : ''}><span>${esc(k)}</span><span${bad ? ' class="is-expired"' : ''}>${dot ? `<i class="exp-dot is-${dot}"></i>` : ''}${esc(v)}</span></div>`).join('');

    // เลข + วันหมดอายุในแถวเดียว ("AB123456 · หมดอายุ 01/02/2570"); หมดอายุแล้ว = ตัวแดง (ไม่บอกจำนวนวัน ตามกติกาของระบบ)
    function docRow(label, no, expiry, warnDays) {
        if (!no && !expiry) return null;
        const expired = expiry && new Date(expiry) < new Date(new Date().toDateString());
        const daysLeft = expiry ? Math.ceil((new Date(expiry) - new Date(new Date().toDateString())) / 86400000) : null;
        const dot = expiry ? (expired ? 'bad' : daysLeft <= warnDays ? 'warn' : 'ok') : '';
        const exp = expiry ? `${expired ? 'หมดอายุแล้ว' : 'หมดอายุ'} ${thaiDate(expiry)}` : '';
        return [label, [no, exp].filter(Boolean).join(' · '), expired, !!(no && exp), dot];
    }

    const NAT_TH = { Myanmar: 'เมียนมา', Cambodia: 'กัมพูชา', Laos: 'ลาว', Vietnam: 'เวียดนาม' };
    const GENDER_TH = { male: 'ชาย', female: 'หญิง', 'ชาย': 'ชาย', 'หญิง': 'หญิง' };

    function renderWorker(result) {
        const w = result.workerInfo;
        if (!w) return;
        const card = document.getElementById('worker-card');
        const initial = esc((String(result.worker || '').replace(/^(MR\.|MRS\.|MISS|MS\.|MASTER)\s*/i, '')[0] || '?').toUpperCase());
        card.innerHTML = `
            ${w.photo ? `<img class="avatar" src="${esc(w.photo)}" alt="">` : `<div class="avatar">${initial}</div>`}
            <div>
                <div class="wname">${esc(result.worker || '-')}</div>
                ${w.thaiName ? `<div class="wsub">${esc(w.thaiName)}</div>` : ''}
                <div class="wsub">${esc([NAT_TH[w.nationality] || w.nationality, w.position].filter(Boolean).join(' · '))}</div>
            </div>`;
        card.classList.remove('hidden');
        const rows = [
            w.workerUid ? ['เลขประจำตัว', w.workerUid] : null,
            w.gender ? ['เพศ', GENDER_TH[String(w.gender).toLowerCase()] || w.gender] : null,
            w.dob ? ['วันเกิด', thaiDate(w.dob)] : null,
            docRow('พาสปอร์ต', w.passportNo, w.passportExpiry, 180),
            docRow('ใบอนุญาตทำงาน', w.permitNo, w.permitExpiry, 60),
            w.pinkCardNo ? ['บัตรชมพู', w.pinkCardNo] : null,
        ].filter(Boolean);
        if (rows.length) {
            document.getElementById('worker-info').innerHTML = infoRowsHtml(rows);
            document.getElementById('worker-info-group').classList.remove('hidden');
        }
    }

    function showStatus(title, text) {
        document.getElementById('title').textContent = title;
        document.getElementById('status').textContent = text;
    }

    async function load() {
        const params = new URLSearchParams(location.search);
        const id = params.get('j');
        const token = params.get('t');
        if (!id || !token) { showStatus('ลิงก์ไม่ถูกต้อง', 'ลิงก์นี้ไม่มีข้อมูลครบถ้วน กรุณาขอลิงก์ใหม่จากเจ้าหน้าที่'); return; }
        document.getElementById('status').textContent = 'กำลังโหลดเอกสาร...';
        try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/share-job-docs?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,
                { headers: { apikey: SUPABASE_ANON_KEY } });
            const result = await res.json();
            if (!res.ok || result.status !== 'success') {
                showStatus('ไม่พบเอกสาร', result.message || 'ลิงก์นี้ถูกยกเลิกแล้ว หรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่จากเจ้าหน้าที่');
                return;
            }
            shared = result;
            document.getElementById('title').textContent = result.jobType || 'ใบงาน';
            document.title = `เอกสารปิดงาน ${result.jobType || ''}`.trim();
            renderWorker(result);
            const rows = [['นายจ้าง', result.employer], ['ปิดงาน', result.closedAt ? thaiDate(result.closedAt) : '']].filter(r => r[1]);
            if (!result.workerInfo && result.worker) rows.unshift(['คนงาน', result.worker]);
            if (rows.length) {
                document.getElementById('info').innerHTML = infoRowsHtml(rows);
                document.getElementById('info-group').classList.remove('hidden');
            }
            const note = result.files.map(f => f.note).find(Boolean);
            if (note) { const el = document.getElementById('note'); el.textContent = `หมายเหตุ: ${note}`; el.classList.remove('hidden'); }
            if (!result.files.length) { document.getElementById('status').textContent = 'ใบงานนี้ยังไม่มีเอกสารปิดงาน'; return; }
            document.getElementById('foot').textContent = `${result.files.length} ไฟล์ · ดู/ดาวน์โหลดได้ ไม่ต้องเข้าสู่ระบบ`;
            document.getElementById('zip-btn').classList.remove('hidden');
            document.getElementById('status').classList.add('hidden');
            const grid = document.getElementById('grid');
            grid.innerHTML = result.files.map(renderTile).join('');
            grid.classList.remove('hidden');
            layoutGrid();
        } catch (e) {
            showStatus('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
        }
    }

    load();
</script>
</body>
</html>
