<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>เอกสารปิดงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* โฟลเดอร์เอกสารปิดงานของใบงาน 1 ใบ (owner 2026-10-26)
       หน้าตาแบบแฟ้มเอกสารในระบบ (owner 2026-10-27): จอเดียวไม่ต้องเลื่อนหน้า — รายการไฟล์ซ้าย / ตัวอย่างไฟล์ขวา
       สีและมุมโค้งตามธีมสว่างของ WorkerOS (พื้น #e7eaf0, การ์ด #f8f9fb, สีหลัก #2d6cf6, ปุ่มแคปซูล) */
    :root {
        --bg: #e7eaf0;
        --card: #f8f9fb;
        --line: #e3e6ee;
        --text: #1c2230;
        --muted: #5b6475;
        --accent: #2d6cf6;
        --accent-soft: #e6eeff;
        --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 10px 30px rgba(20, 30, 60, .08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Sukhumvit Set", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
    }
    body::before {
        content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: radial-gradient(60% 50% at 15% 0%, rgba(45, 108, 246, .10), transparent 70%),
                    radial-gradient(50% 40% at 100% 100%, rgba(45, 108, 246, .07), transparent 70%);
    }
    .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 14px; max-width: 1640px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }

    .top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
    .top img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
    .top .head { flex: 1; min-width: 0; }
    .top h1 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top p { margin: 2px 0 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: #1d4fc4; white-space: nowrap; }

    .btn {
        border: none; border-radius: 999px; padding: 0 18px; height: 40px; font: inherit; font-size: 14.5px; font-weight: 600;
        background: var(--accent); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
        text-decoration: none;
    }
    .btn.ghost { background: #eceef3; color: var(--text); }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn svg { width: 17px; height: 17px; flex-shrink: 0; }

    .main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; min-height: 0; }
    .list { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .list-head { padding: 14px 16px 6px; font-size: 13px; color: var(--muted); }
    .files { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px 8px; }
    .file {
        width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: none; border-radius: 14px;
        background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer;
    }
    .file:hover { background: #eef0f5; }
    .file.is-on { background: var(--accent-soft); }
    .file.is-on .fname { color: #1d4fc4; }
    .thumb { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; background: #fff; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .ext { font-size: 11px; font-weight: 700; color: #a8321f; }
    .fname { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fsub { font-size: 12.5px; color: var(--muted); }
    .file .txt { min-width: 0; }
    .note { margin: 0; padding: 12px 16px 14px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); line-height: 1.5; }

    .viewer { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .vbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); }
    .vbar .vname { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vbody { flex: 1; min-height: 0; background: #eef0f4; display: flex; align-items: center; justify-content: center; border-radius: 0 0 22px 22px; overflow: hidden; }
    .vbody iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .vbody img { max-width: 100%; max-height: 100%; object-fit: contain; }

    #status { display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; color: var(--muted); font-size: 15px; }
    .hidden { display: none !important; }

    /* มือถือ: รายการไฟล์เป็นแถบเลื่อนแนวนอนด้านบน ตัวอย่างไฟล์เต็มที่เหลือ */
    @media (max-width: 760px) {
        .app { padding: 10px; gap: 10px; }
        .top { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
        .top img { width: 34px; height: 34px; }
        .top .head { flex-basis: calc(100% - 48px); }
        .top .pill { margin-left: 44px; }
        .top #zip-btn { margin-left: auto; height: 36px; font-size: 13.5px; }
        .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
        .list-head, .note { display: none; }
        .files { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 8px; }
        .file { width: auto; flex-shrink: 0; max-width: 220px; padding: 6px 10px 6px 6px; }
        .thumb { width: 36px; height: 36px; }
        .vbar { padding: 8px 8px 8px 14px; }
        .vbar .btn { padding: 0 12px; height: 36px; }
        .vbar .btn span { display: none; }
    }
</style>
</head>
<body>
<div class="app">
    <header class="card top">
        <img src="assets/logo-transparent.png" alt="">
        <div class="head">
            <h1 id="title">กำลังโหลดเอกสาร...</h1>
            <p id="sub">ลิงก์นี้ใช้ดู/ดาวน์โหลดเอกสารเท่านั้น — ไม่ต้องเข้าสู่ระบบ</p>
        </div>
        <span class="pill hidden" id="count"></span>
        <button class="btn hidden" id="zip-btn" type="button" onclick="downloadAll()" title="ดาวน์โหลดเอกสารทุกไฟล์รวมเป็น ZIP">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
            ดาวน์โหลดทั้งหมด (ZIP)
        </button>
    </header>

    <div id="status" class="card"></div>

    <div class="main hidden" id="main">
        <aside class="card list">
            <div class="list-head">เอกสารในใบงานนี้</div>
            <div class="files" id="files"></div>
            <p class="note hidden" id="note"></p>
        </aside>
        <section class="card viewer">
            <div class="vbar">
                <div class="vname" id="vname"></div>
                <a class="btn ghost" id="open-btn" href="#" target="_blank" rel="noopener" title="เปิดไฟล์นี้ในแท็บใหม่">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                    <span>เปิดเต็มจอ</span>
                </a>
                <button class="btn" type="button" id="dl-btn" onclick="downloadCurrent()" title="ดาวน์โหลดไฟล์นี้">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>
                    <span>ดาวน์โหลด</span>
                </button>
            </div>
            <div class="vbody" id="vbody"></div>
        </section>
    </div>
</div>
<script>
    const SUPABASE_URL = "https://cagpzvrqtjkuabhqaqon.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QXr8rEnSqOhAZzc_pO_Egw_h-ZYb0nn";
    let shared = null;
    let current = 0;

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const IMG_RE = /\.(jpe?g|png|gif|webp|bmp)(\?|$)/i;
    const isImage = (f) => IMG_RE.test(f.name || '') || IMG_RE.test(f.url || '');
    const fileName = (f, k) => f.name || `ไฟล์ ${k + 1}`;
    const extOf = (f) => ((String(f.name || f.url || '').split('?')[0].match(/\.([a-z0-9]+)$/i) || [])[1] || 'file').toUpperCase().slice(0, 4);

    function renderList() {
        document.getElementById('files').innerHTML = shared.files.map((f, k) => `
            <button type="button" class="file${k === current ? ' is-on' : ''}" onclick="selectFile(${k})" title="${esc(fileName(f, k))}">
                <span class="thumb">${isImage(f) ? `<img src="${esc(f.url)}" alt="" loading="lazy">` : `<span class="ext">${esc(extOf(f))}</span>`}</span>
                <span class="txt"><div class="fname">${esc(fileName(f, k))}</div><div class="fsub">${isImage(f) ? 'รูปภาพ' : extOf(f) === 'PDF' ? 'PDF' : 'ไฟล์'}</div></span>
            </button>`).join('');
    }

    function selectFile(k) {
        if (!shared || !shared.files[k]) return;
        current = k;
        const f = shared.files[k];
        document.getElementById('vname').textContent = fileName(f, k);
        document.getElementById('open-btn').href = f.url;
        document.getElementById('vbody').innerHTML = isImage(f) ? `<img src="${esc(f.url)}" alt="${esc(fileName(f, k))}">` : `<iframe src="${esc(f.url)}" title="${esc(fileName(f, k))}"></iframe>`;
        renderList();
        const on = document.querySelector('.file.is-on');
        if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    // ลูกศรขึ้น/ลง (ซ้าย/ขวา) เลื่อนไฟล์
    document.addEventListener('keydown', (e) => {
        if (!shared || !shared.files.length) return;
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); selectFile(Math.min(shared.files.length - 1, current + 1)); }
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); selectFile(Math.max(0, current - 1)); }
    });

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    function saveBlob(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    // ไฟล์อยู่คนละโดเมน — ดึงเป็น blob ก่อนจึงจะตั้งชื่อไฟล์ตอนดาวน์โหลดได้ (ไม่ได้ก็เปิดในแท็บใหม่แทน)
    async function downloadCurrent() {
        const f = shared && shared.files[current];
        if (!f) return;
        const btn = document.getElementById('dl-btn');
        btn.disabled = true;
        try {
            saveBlob(await (await fetch(f.url)).blob(), fileName(f, current).replace(/[\\/:*?"<>|]/g, '_'));
        } catch (e) {
            window.open(f.url, '_blank', 'noopener');
        } finally {
            btn.disabled = false;
        }
    }

    // รวมทุกไฟล์เป็น ZIP ในเบราว์เซอร์ (ชื่อซ้ำเติม _2, _3)
    async function downloadAll() {
        const btn = document.getElementById('zip-btn');
        btn.disabled = true;
        try {
            if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
            const zip = new JSZip();
            const used = {};
            for (const [k, f] of shared.files.entries()) {
                const blob = await (await fetch(f.url)).blob();
                let name = fileName(f, k).replace(/[\\/:*?"<>|]/g, '_');
                if (used[name]) { const n = ++used[name]; name = name.replace(/(\.[^.]*)?$/, m => `_${n}${m}`); } else used[name] = 1;
                zip.file(name, blob);
            }
            saveBlob(await zip.generateAsync({ type: 'blob' }), `เอกสารปิดงาน ${shared.worker || ''} ${shared.jobType || ''}`.trim() + '.zip');
        } catch (e) {
            alert('ดาวน์โหลดรวมไม่สำเร็จ — กดดาวน์โหลดทีละไฟล์แทน');
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(title, text) {
        document.getElementById('title').textContent = title;
        document.getElementById('status').textContent = text;
    }

    async function load() {
        const params = new URLSearchParams(location.search);
        const id = params.get('j');
        const token = params.get('t');
        if (!id || !token) { showStatus('ลิงก์ไม่ถูกต้อง', 'ลิงก์นี้ไม่มีข้อมูลครบถ้วน กรุณาขอลิงก์ใหม่จากเจ้าหน้าที่'); return; }
        document.getElementById('status').textContent = 'กำลังโหลดเอกสาร...';
        try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/share-job-docs?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,
                { headers: { apikey: SUPABASE_ANON_KEY } });
            const result = await res.json();
            if (!res.ok || result.status !== 'success') {
                showStatus('ไม่พบเอกสาร', result.message || 'ลิงก์นี้ถูกยกเลิกแล้ว หรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่จากเจ้าหน้าที่');
                return;
            }
            shared = result;
            document.getElementById('title').textContent = `เอกสารปิดงาน ${result.jobType || ''}`.trim();
            document.title = document.getElementById('title').textContent;
            const sub = [result.worker, result.employer].filter(Boolean).join(' · ');
            if (sub) document.getElementById('sub').textContent = sub;
            if (!result.files.length) { document.getElementById('status').textContent = 'ใบงานนี้ยังไม่มีเอกสารปิดงาน'; return; }
            document.getElementById('status').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
            document.getElementById('zip-btn').classList.remove('hidden');
            const count = document.getElementById('count');
            count.textContent = `${result.files.length} ไฟล์`;
            count.classList.remove('hidden');
            const note = result.files.map(f => f.note).find(Boolean);
            if (note) { const el = document.getElementById('note'); el.textContent = `หมายเหตุ: ${note}`; el.classList.remove('hidden'); }
            selectFile(0);
        } catch (e) {
            showStatus('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
        }
    }

    load();
</script>
</body>
</html>
